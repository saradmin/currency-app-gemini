name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        printf "89330d32231823721117877a322ef08f3560f99a\n24333702352690920997646f01e6142db90e7380\nd56f5187479451eabf01fb78af6dfcb131a6481e\n248824f79a62b165b642e4051b72ad6873d20510\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"

    - name: Build Debug APK
      run: gradle assembleDebug
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CurrencyApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
